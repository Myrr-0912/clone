<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber Clone Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Local MVP</p>
        <h1>Cyber Clone Lab</h1>
      </div>
      <div class="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </header>

    <main class="layout">
      <section class="panel upload-panel" aria-labelledby="upload-title">
        <h2 id="upload-title">训练输入</h2>
        <form id="clone-form" class="clone-form">
          <label>
            <span>克隆对象名称</span>
            <input id="target-name" name="targetName" type="text" value="Target" autocomplete="off" required />
          </label>

          <div class="resume-section" aria-label="恢复已有克隆">
            <label>
              <span>已有克隆 ID</span>
              <input id="clone-id-input" type="text" autocomplete="off" placeholder="clone id" />
            </label>
            <button id="load-clone-button" class="secondary compact-button" type="button">加载克隆</button>
          </div>

          <div class="import-section">
            <div class="section-head">
              <h3>本地文件导入</h3>
              <span class="badge">全部本地</span>
            </div>

            <div class="local-file-grid">
              <label>
                <span>聊天文本文件（可多选）</span>
                <input id="chat-file" name="chatFile" type="file" accept=".txt,.json,.csv,.md" multiple />
              </label>
              <label>
                <span>语音文件（可多选）</span>
                <input id="voice-file" name="voiceFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg" multiple />
              </label>
            </div>

            <div class="record-panel">
              <button id="record-voice-button" class="secondary compact-button" type="button">录制语音样本</button>
              <span id="recording-state" class="recording-state">麦克风未开始</span>
            </div>

            <div class="sample-panel" aria-live="polite">
              <div class="section-head compact">
                <h3>语音样本</h3>
                <span id="training-state" class="badge">等待上传</span>
              </div>
              <ul id="sample-list" class="sample-list">
                <li>尚未选择语音样本</li>
              </ul>
              <div class="sample-actions">
                <button id="voice-upload-button" class="secondary compact-button" type="button" disabled>保存样本</button>
                <button id="voice-train-button" class="secondary compact-button" type="button" disabled>训练音色</button>
                <button id="voice-refresh-button" class="secondary compact-button" type="button" disabled>刷新状态</button>
              </div>
            </div>

            <label>
              <span>聊天文本内容</span>
              <textarea id="chat-text" name="chatText" rows="10" placeholder="Target: hahaha"></textarea>
            </label>
          </div>

          <label class="consent">
            <input id="consent" type="checkbox" required />
            <span>我确认拥有上传声音和聊天记录的使用授权，并同意生成内容标记为 AI 合成。</span>
          </label>

          <button class="primary" type="submit">开始训练</button>
          <p id="status" class="status" role="status"></p>
        </form>
      </section>

      <section class="panel profile-panel" aria-labelledby="profile-title">
        <h2 id="profile-title">克隆画像</h2>
        <dl class="profile-grid">
          <div>
            <dt>口头禅</dt>
            <dd id="catchphrases">等待训练</dd>
          </div>
          <div>
            <dt>关键话题</dt>
            <dd id="topics">等待训练</dd>
          </div>
          <div>
            <dt>音色状态</dt>
            <dd id="voice-status">等待训练</dd>
          </div>
          <div>
            <dt>样本量</dt>
            <dd id="source-stats">等待训练</dd>
          </div>
        </dl>
      </section>

      <section class="panel chat-panel" aria-labelledby="chat-title">
        <h2 id="chat-title">聊天测试</h2>
        <div class="chat-toolbar">
          <fieldset class="mode-toggle" aria-label="聊天模式">
            <label>
              <input id="chat-mode-text" name="chatMode" type="radio" value="text" checked />
              <span>文本</span>
            </label>
            <label>
              <input id="chat-mode-voice" name="chatMode" type="radio" value="voice" />
              <span>语音</span>
            </label>
          </fieldset>
          <label class="emotion-control">
            <span>情绪</span>
            <select id="voice-emotion">
              <option value="auto" selected>自动</option>
              <option value="natural">自然</option>
              <option value="warm">温柔</option>
              <option value="happy">开心</option>
              <option value="calm">平静</option>
              <option value="sad">低落</option>
              <option value="excited">兴奋</option>
            </select>
          </label>
        </div>
        <div id="messages" class="messages" aria-live="polite">
          <p class="empty">训练完成后可以在这里试聊。</p>
        </div>
        <audio id="audio-playback" class="audio-playback" controls hidden></audio>
        <form id="chat-form" class="chat-form">
          <input id="message-input" type="text" placeholder="发一句试试" autocomplete="off" disabled />
          <button type="submit" disabled>发送</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
